[project]
name = "glimmer-grader"
version = "0.1.0"
description = "CORAL dev grader for the Glimmer harness: returns the control host's DEV score for the adapter named in submission.json."
requires-python = ">=3.11"
dependencies = [
    "coral",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glimmer_grader"]
